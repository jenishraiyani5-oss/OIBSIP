<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script> 
</head>
<body>
    <div class="calculator">
        <input type="text" class="screen" value="0" disabled>
        
        <div class="keys">
            <!-- Row 1 -->
            <button class="all-clear" value="all-clear">AC</button>
            <button class="delete" value="delete">DEL</button>
            <button class="operator" value="/">&#247;</button>
            <button class="operator" value="*">&#215;</button>

            <!-- Row 2 -->
            <button value="7">7</button>
            <button value="8">8</button>
            <button value="9">9</button>
            <button class="operator" value="-">-</button>

            <!-- Row 3 -->
            <button value="4">4</button>
            <button value="5">5</button>
            <button value="6">6</button>
            <button class="operator" value="+">+</button>

            <!-- Row 4 -->
            <button value="1">1</button>
            <button value="2">2</button>
            <button value="3">3</button>
            <button class="equal-sign operator" value="=">=</button>

            <!-- Row 5 -->
            <button class="btn-zero" value="0">0</button>
            <button class="decimal" value=".">.</button>
        </div>
    </div>      
</body>
</html>
